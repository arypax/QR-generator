[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200

[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "public"

[functions]
  included_files = ["./views/**", "./public/**", "./ales logo.png", "./server.js", "./src/**"]
  node_bundler = "esbuild"
  external_node_modules = ["ejs", "sharp", "better-sqlite3", "nanoid", "pg"]

